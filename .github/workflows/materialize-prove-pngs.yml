name: materialize-prove-pack
on:
  push:
    paths:
      - ".github/pack-b64/**"
      - ".github/workflows/materialize-prove-pngs.yml"
      - ".github/assert-prove-pngs.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble b64 chunks, extract tar, commit real PNGs + tip-html
        run: |
          set -euo pipefail
          shopt -s nullglob
          chunks=(.github/pack-b64/pack.b64.*)
          echo "chunks=${#chunks[@]}"
          if [ "${#chunks[@]}" -lt 10 ]; then
            echo "waiting for all 10 chunks"
            exit 0
          fi
          cat "${chunks[@]}" | tr -d '\n' | base64 -d > /tmp/pack.tgz
          tar -tzf /tmp/pack.tgz
          tar -xzf /tmp/pack.tgz
          python3 .github/assert-prove-pngs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- portal-pr23-sample-out-5f84300
          if git diff --cached --quiet; then
            echo pack already materialized
            exit 0
          fi
          git commit -m "Materialize Soft CLEAR prove pack PNGs + tip-html (tip 5f84300)"
          git push
