name: materialize-prove-pngs
on:
  push:
    paths:
      - "**/*.png.b64"
      - ".github/workflows/materialize-prove-pngs.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode PNG base64 to binary PNG
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' f; do
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            file "$out"
            sha256sum "$out"
            python3 -c "import pathlib,sys; b=pathlib.Path(sys.argv[1]).read_bytes(); assert b[:8]==bytes.fromhex('89504e470d0a1a0a'), 'not png'" "$out"
            found=1
          done < <(find . -name '*.png.b64' -print0)
          test "$found" = 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'portal-pr23-sample-out-5f84300/*.png'
          if git diff --cached --quiet; then
            echo "PNGs already present"
            exit 0
          fi
          git commit -m "Materialize Soft CLEAR prove PNGs (tip 5f84300)"
          git push
